<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>地板行情</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="masthead compact">
      <div>
        <p class="subtitle">傲来国 · 神笔马良</p>
        <h1>地板行情</h1>
      </div>
      <nav class="page-nav" aria-label="页面导航">
        <a class="nav-button" href="./index.html">差价计算</a>
        <a class="nav-button" href="./market.html">区内行情</a>
        <a class="nav-button active" href="./floors.html" aria-current="page">地板行情</a>
        <a class="nav-button" href="./equipment.html">宝宝装备</a>
        <a class="nav-button" href="./eyes.html">三眼九眼</a>
        <a class="nav-button" href="./stones.html">灵石合成</a>
        <a class="nav-button" href="./festival.html">元宵珍经</a>
      </nav>
    </header>

    <main>
      <section class="floor-panel" aria-labelledby="floor-title">
        <div>
          <h2 id="floor-title">地板价格以及出货时间</h2>
          <p>可直接修改，保存后用于日常查阅。</p>
        </div>
        <div class="floor-table-wrap">
          <table>
            <thead>
              <tr>
                <th>地板名称</th>
                <th>价格（万两）</th>
                <th>出货时间</th>
              </tr>
            </thead>
            <tbody id="floor-records"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer>
      <p>地板价格按梦幻币 W 结算，即表格中的 1 表示 1 万两；数据和出货时间仅保存在本地浏览器。</p>
    </footer>

    <script src="./calculator.js"></script>
    <script src="./opportunity-plans.js"></script>
    <script src="./gold-price-history.js"></script>
    <script src="./stall-price-history.js"></script>
    <script src="./floor-market.js"></script>
    <script src="./equipment-prices.js"></script>
    <script src="./spirit-stones.js"></script>
    <script src="./festival-items.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
