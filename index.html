<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>灵兽绘卷差价计算</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="masthead compact">
      <div>
        <p class="subtitle">傲来国 · 神笔马良</p>
        <h1>灵兽绘卷差价计算器</h1>
      </div>
      <nav class="page-nav" aria-label="页面导航">
        <a class="nav-button active" href="./index.html" aria-current="page">差价计算</a>
        <a class="nav-button" href="./market.html">区内行情</a>
        <a class="nav-button" href="./floors.html">地板行情</a>
        <a class="nav-button" href="./equipment.html">宝宝装备</a>
        <a class="nav-button" href="./eyes.html">三眼九眼</a>
        <a class="nav-button" href="./stones.html">灵石比价</a>
        <a class="nav-button" href="./festival.html">元宵珍经</a>
      </nav>
    </header>

    <main>
      <section class="summary current-market" aria-labelledby="current-market-title">
        <div>
          <h2 id="current-market-title">当前行情</h2>
          <p id="current-market-summary">金价和手续费在区内行情页统一维护。</p>
        </div>
        <a class="nav-button" href="./market.html">去区内行情修改</a>
      </section>

      <section class="summary opportunity-selector" aria-labelledby="opportunity-selector-title">
        <div>
          <h2 id="opportunity-selector-title">选择召唤兽方案</h2>
          <p>先选召唤兽和技能数量，下面只显示当前这一张方案卡。</p>
        </div>
        <div class="opportunity-selector-fields">
          <label>
            召唤兽
            <select id="opportunity-picker" aria-label="选择召唤兽"></select>
          </label>
          <label>
            技能数量
            <select id="skill-count-picker" aria-label="选择技能数量">
              <option value="">未选择</option>
              <option value="1">1技能</option>
              <option value="2">2技能</option>
              <option value="3">3技能</option>
              <option value="4">4技能</option>
              <option value="5">5技能</option>
              <option value="6">6技能</option>
              <option value="7">7技能</option>
              <option value="8">8技能</option>
              <option value="9">9技能</option>
              <option value="10">10技能</option>
              <option value="11">11技能</option>
              <option value="12">12技能</option>
            </select>
          </label>
        </div>
      </section>

      <section class="material-prices" aria-labelledby="material-prices-title">
        <div>
          <h2 id="material-prices-title">统一材料价格</h2>
          <p>材料名称和单价只在这里维护，所有召唤兽方案共用这份价格。</p>
        </div>
        <div id="material-price-fields" class="material-price-fields"></div>
      </section>

      <section class="summary opportunity-summary" aria-label="当前方案利润">
        <div>
          <h2>当前方案利润</h2>
          <ul id="opportunity-summary-list"></ul>
        </div>
        <span id="summary-text">只计算当前选中的召唤兽方案</span>
      </section>

      <section id="opportunities" class="opportunities" aria-label="兑换机会"></section>

      <div class="actions">
        <button id="add-opportunity" class="primary" type="button">添加独立方案</button>
      </div>
    </main>

    <footer>
      <p>公式：材料成本 = Σ(数量 × 单价)；人民币成本按所选金价单位换算；净利润 = 藏宝阁售价 − min(售价 × 手续费率, 上限) − 材料成本 − 野生/胚子成本。</p>
    </footer>

    <script src="./calculator.js"></script>
    <script src="./opportunity-plans.js"></script>
    <script src="./gold-price-history.js"></script>
    <script src="./stall-price-history.js"></script>
    <script src="./floor-market.js"></script>
    <script src="./equipment-prices.js"></script>
    <script src="./spirit-stones.js"></script>
    <script src="./festival-items.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
