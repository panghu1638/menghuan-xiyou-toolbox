<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>召唤兽行情</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="masthead compact">
      <div>
        <p class="subtitle">傲来国 · 神笔马良</p>
        <h1>召唤兽行情</h1>
      </div>
      <nav class="page-nav" aria-label="页面导航">
        <div class="nav-group">
          <span class="nav-group-label">价格行情</span>
          <div class="nav-links">
            <a class="nav-button" href="./index.html">差价计算</a>
            <a class="nav-button" href="./market.html">区内行情</a>
            <a class="nav-button active" href="./pets.html" aria-current="page">召唤兽行情</a>
            <a class="nav-button" href="./equipment.html">宝宝装备</a>
            <a class="nav-button" href="./eyes.html">三眼九眼</a>
            <a class="nav-button" href="./stones.html">灵石合成</a>
          </div>
        </div>
        <div class="nav-group nav-group-time">
          <span class="nav-group-label">出货时间</span>
          <div class="nav-links">
            <a class="nav-button" href="./floors.html">地板出货时间</a>
            <a class="nav-button" href="./equipment-times.html">宠装出货</a>
            <a class="nav-button" href="./fusion-times.html">炼妖出货</a>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="reference-panel" aria-labelledby="pet-market-title">
        <div>
          <h2 id="pet-market-title">梦幻币收价与藏宝阁比价</h2>
          <p id="pet-market-gold-summary">填写梦幻币收价和藏宝阁售价后自动计算净利润。</p>
        </div>
        <div class="pet-equipment-time-actions">
          <label>
            <span>新增召唤兽</span>
            <input id="pet-market-add-name" type="text" placeholder="召唤兽名" />
          </label>
          <button id="pet-market-add-record" type="button" class="primary">添加召唤兽</button>
        </div>
        <div id="pet-market-records" class="reference-grid pet-market-grid"></div>
      </section>
    </main>

    <footer>
      <p>每只宝宝可添加多个技能档（3技能、4技能各一行）；净利润 = 藏宝阁到手 −（梦幻币收价或野生成本）× 当前金价，梦幻币收价优先。</p>
    </footer>

    <script src="./calculator.js"></script>
    <script src="./opportunity-plans.js"></script>
    <script src="./gold-price-history.js"></script>
    <script src="./stall-price-history.js"></script>
    <script src="./floor-market.js"></script>
    <script src="./equipment-prices.js"></script>
    <script src="./pet-equipment-times.js"></script>
    <script src="./pet-fusion-times.js"></script>
    <script src="./spirit-stones.js"></script>
    <script src="./festival-items.js"></script>
    <script src="./pet-market.js"></script>
    <script src="./craft-prices.js"></script>
    <script src="./data-backup.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
